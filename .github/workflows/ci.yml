name: distiller-ci

on:
  push:
  pull_request:

jobs:
  # Blocks a release branch on its way into master, and re-derives its verdict
  # from the branch contents rather than from the run that produced them
  # (M2-004). Deliberately skipped -- not failed -- on every other pull request:
  # a job that failed on an ordinary PR would say the change is bad when all it
  # means is that this gate does not apply to it.
  merge-gate:
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'master' &&
      startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    # No secret is declared and none is needed: the gate reads a checkout and
    # makes no request, which is what keeps it green on a fork pull request.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Re-validate the release branch (schema, citations, evidence rules)
        # --review-request-required: this job only runs for a release/* head,
        # and on such a branch a missing review request is itself the failure.
        run: python -m memory_net.distiller.merge_gate . --review-request-required

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Import order (isort)
        run: isort --check-only .
      - name: Static types (mypy)
        run: mypy memory_net
      - name: Run tests
        run: pytest
      # The offline regression against a recording of a real production run:
      # blocking on every PR, and free. It needs no credential and makes no
      # request, so it stays green on a fork PR, which never sees a secret.
      - name: Golden bundle strict replay (offline, blocking)
        run: pytest tests/unit/test_golden_replay.py tests/unit/test_provider_equivalence.py -q
      - name: Run local integration
        run: bash tests/integration/local_repo.sh
      - name: Run leaf install integration
        run: bash tests/integration/install_leaf_local.sh
      # The accelerated lane of the three-leaf soak: minutes, no provider quota,
      # and blocking. Same code path as the operator's 24h lane in
      # docs/runbook.md -- only the stopping condition differs, so this step is
      # not evidence of a 24h run.
      - name: Run three-leaf stability soak (accelerated)
        # Bounded: the driver waits on a subprocess with no deadline of its own,
        # so a hung git would otherwise hold the runner until the job limit.
        timeout-minutes: 15
        run: python scripts/stability_soak.py --leaves 3 --cycles 5 --report stability_soak_report.json
      - name: Validate shared pilot gate
        run: python scripts/validate_shared_pilot_gate.py
      - name: Upload distiller diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distiller-diagnostics
          # `**/record_runs/**` is deliberately gone. A bundle holds whole
          # prompts and whole responses, so uploading one publishes them; the
          # per-run summary carries what a reader of this artifact needs. That
          # reduces second-hand exposure and does not replace the write-time
          # gate, which is the actual defence.
          path: |
            **/.health.json
            **/distill_runs/**/metrics.json
            **/record_metrics.json
            stability_soak_report.json
          if-no-files-found: ignore
