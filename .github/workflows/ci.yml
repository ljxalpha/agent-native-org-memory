name: distiller-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Import order (isort)
        run: isort --check-only .
      - name: Static types (mypy)
        run: mypy memory_net
      - name: Run tests
        run: pytest
      - name: Run local integration
        run: bash tests/integration/local_repo.sh
      - name: Run leaf install integration
        run: bash tests/integration/install_leaf_local.sh
      - name: Validate shared pilot gate
        run: python scripts/validate_shared_pilot_gate.py
      - name: Upload distiller diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distiller-diagnostics
          path: |
            **/.health.json
            **/distill_runs/**/metrics.json
            **/record_runs/**
          if-no-files-found: ignore
