name: distill

on:
  workflow_dispatch:

concurrency:
  group: distill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distill:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      # Same scope as distiller-ci: memory_net is the strictly typed surface.
      # `mypy .` never resolved here (scripts/ maps to two module names at once).
      - run: mypy memory_net
      - run: pytest
      - run: bash tests/integration/local_repo.sh
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ matrix.os }}
          # Named files, not the whole distill_runs tree. That tree holds the
          # run's product snapshot, so uploading it publishes team knowledge as
          # a build artifact; these three are summaries and pointers only.
          path: |
            .pytest_cache
            **/distill_runs/**/metrics.json
            **/distill_runs/**/review_request.json
            **/distill_runs/**/unclustered.json
            **/*.log
          if-no-files-found: ignore
