name: distill

on:
  workflow_dispatch:

concurrency:
  group: distill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distill:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy .
      - run: pytest
      - run: bash tests/integration/local_repo.sh
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}
          path: |
            .pytest_cache
            distill_runs
            **/*.log
          if-no-files-found: ignore
