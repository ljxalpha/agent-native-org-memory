name: distill

on:
  workflow_dispatch:

concurrency:
  group: distill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distill:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # Same install as distiller-ci, so both run the same tests.
      - run: python -m pip install -e ".[dev,llm]"
      - run: ruff check .
      # Same scope as distiller-ci: memory_net is the strictly typed surface.
      # `mypy .` never resolved here (scripts/ maps to two module names at once).
      - run: mypy memory_net
      - run: pytest
      - run: bash tests/integration/local_repo.sh
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.os }}
          # Named files, not the whole distill_runs tree. That tree holds the
          # run's product snapshot, so uploading it publishes team knowledge as
          # a build artifact; these three are summaries and pointers only.
          path: |
            .pytest_cache
            **/distill_runs/**/metrics.json
            **/distill_runs/**/review_request.json
            **/distill_runs/**/unclustered.json
            **/*.log
          if-no-files-found: ignore
