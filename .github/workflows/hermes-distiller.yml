name: production-live-smoke

# Manual only, and it spends real quota. The blocking regression against a real
# model's output is in ci.yml, replaying a recorded bundle -- this job exists to
# prove the live path still connects, not to test behaviour.
#
# The job no longer installs an agent CLI. The production distillation backend
# is a direct OpenAI-compatible endpoint (§5.3.3), so there is nothing here that
# needs one -- which also disposes of the question of where a public workflow
# would get a pinned, reproducible agent build from.
on:
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      # `.[dev,llm]`, not `.[dev]`: the OpenAI client is an opt-in extra, so
      # `.[dev]` alone reaches the backend and raises ImportError.
      - name: Install package
        run: python -m pip install -e '.[dev,llm]'

      # Three preflights, in this order, each its own step. A missing
      # dependency or a misconfigured endpoint is a failure; only a missing
      # credential is a skip. Checking the credential first would swallow the
      # other two whenever the secret happens to be absent, which is the state
      # a fork PR and most manual runs are in.
      - name: Preflight - dependency
        run: python -c "import openai"

      - name: Preflight - endpoint
        env:
          BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
        # A repository variable rather than a secret: the value is a public
        # endpoint URL, so it stays reproducible and reviewable. No default in
        # code, on purpose -- a silent default turns "misconfigured" into
        # "connected to somewhere else".
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL}" ]; then
            echo "vars.DEEPSEEK_BASE_URL is not set"; exit 1
          fi
          case "${BASE_URL}" in
            https://*) ;;
            *) echo "DEEPSEEK_BASE_URL must be https://"; exit 1 ;;
          esac
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 -X GET "${BASE_URL}/models")"
          # 401 and 403 mean the endpoint is alive and this step simply carries
          # no credential, which is the point of separating it from the next one.
          case "${code}" in
            200|401|403) echo "endpoint reachable (${code})" ;;
            *) echo "endpoint check failed (${code})"; exit 1 ;;
          esac

      - name: Preflight - credential
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        # Tested inside the step, not in a job-level `if:`: the `secrets`
        # context is not available to job-level conditions.
        run: |
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "skipped: no credential"
          else
            echo "credential present"
          fi

      - name: Live smoke against the production backend
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "skipped: no credential"; exit 0
          fi
          python tests/fixtures/golden_repo/build_repo.py --out "$RUNNER_TEMP/golden_repo"
          # `--env-file /dev/null` reads no credential file: the two variables
          # are already in this step's environment and reach the child through
          # execve, never through a command line.
          scripts/aomt-with-env --env-file /dev/null -- \
            memory-net-distiller run \
              --repo "$RUNNER_TEMP/golden_repo" \
              --config config/distill.deepseek.yaml \
              --provider deepseek \
              --record-dir "$RUNNER_TEMP/smoke_bundle" --no-push

      - name: Upload the smoke summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-smoke-metrics
          # The summary only. The bundle itself holds whole prompts and whole
          # responses and is never uploaded.
          path: ${{ runner.temp }}/smoke_bundle/record_metrics.json
          if-no-files-found: ignore
