name: hermes-distiller-ci

on:
  workflow_dispatch:

jobs:
  hermes-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Hermes provider import smoke
        run: python -c "from memory_net.distiller.llm.hermes_tool import HermesToolProvider; print(HermesToolProvider(command='cat'))"
