[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aomt"
version = "0.1.0"
description = "Distill each agent's scattered memories into shared organizational knowledge, and feed it back to every agent."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ljxalpha", email = "36989185+ljxalpha@users.noreply.github.com" }]
keywords = ["llm", "agents", "memory", "distillation", "git", "multi-agent", "organizational-memory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "apscheduler>=3.10",
  "anthropic>=0.34",
  "click>=8.1",
  "fastembed>=0.3",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Upper-bounded on purpose. Linters and formatters change their *verdicts* across
# majors — new default rules, a new stable format year, stricter inference — so an
# unbounded range means an upstream release can turn CI red on code nobody touched.
# Bumping a bound is then a deliberate, reviewable change instead of a surprise.
dev = [
  "black>=26.0,<27",
  "isort>=8.0,<9",
  "mypy>=2.3,<3",
  "pytest>=9.0,<10",
  "ruff>=0.16,<0.17",
]

[project.scripts]
memory-net-leaf = "memory_net.leaf.cli:main"
memory-net-distiller = "memory_net.distiller.cli:main"

[project.urls]
Homepage = "https://github.com/ljxalpha/agent-native-org-memory"
Repository = "https://github.com/ljxalpha/agent-native-org-memory"
Issues = "https://github.com/ljxalpha/agent-native-org-memory/issues"

[tool.setuptools.packages.find]
include = ["memory_net*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# TRY004 asks isinstance guards to raise TypeError. In the files below, every
# such guard validates *deserialized* input (JSON manifests, YAML config,
# replayed bundles, LLM output) and deliberately raises ValueError/RuntimeError,
# because those types are load-bearing: callers catch them to quarantine one bad
# leaf or one bad record instead of aborting the run (e.g. the distiller catches
# `(json.JSONDecodeError, KeyError, ValueError, GitError)` per leaf). Switching
# them to TypeError would let the exception escape those handlers and change
# runtime behavior, so this is not a mechanical rewrite.
#
# Listed per file rather than ignored globally, so a *new* TRY004 anywhere else
# still fails the lint instead of being silently absorbed.
"memory_net/distiller/conflict.py" = ["TRY004"]
"memory_net/distiller/llm/recording.py" = ["TRY004"]
"memory_net/distiller/orchestrator.py" = ["TRY004"]
"memory_net/distiller/pipeline.py" = ["TRY004"]
"memory_net/leaf/cli.py" = ["TRY004"]
"memory_net/shared/observability/__init__.py" = ["TRY004"]
"memory_net/shared/util/frontmatter.py" = ["TRY004"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# These third-party libraries ship no type stubs; treat as untyped.
# (yaml is handled by per-import `# type: ignore[import-untyped]`, kept hermetic
#  so results don't depend on whether types-PyYAML happens to be installed.)
module = ["fastembed.*", "sklearn.*", "anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
