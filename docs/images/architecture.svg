<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="rootFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241f44"/>
      <stop offset="1" stop-color="#1a1733"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2335"/>
      <stop offset="1" stop-color="#211d12"/>
    </linearGradient>

    <marker id="ahCyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
    <marker id="ahEmerald" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker>
    <marker id="ahAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#fbbf24"/></marker>

    <symbol id="person" viewBox="0 0 40 48">
      <circle cx="20" cy="13" r="9" fill="#cbd5e1"/>
      <path d="M5 46 C5 31 35 31 35 46 Z" fill="#cbd5e1"/>
    </symbol>
    <symbol id="robot" viewBox="0 0 48 48">
      <line x1="24" y1="9" x2="24" y2="3" stroke="#64748b" stroke-width="2"/>
      <circle cx="24" cy="3" r="2.6" fill="#38bdf8"/>
      <rect x="8" y="9" width="32" height="28" rx="7" fill="#1f2d45" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="18" cy="23" r="3.2" fill="#38bdf8"/>
      <circle cx="30" cy="23" r="3.2" fill="#38bdf8"/>
      <rect x="17" y="30" width="14" height="3" rx="1.5" fill="#38bdf8" opacity="0.55"/>
    </symbol>

    <symbol id="icCommon" viewBox="0 0 24 24">
      <circle cx="8" cy="9" r="4" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="16" cy="9" r="4" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="12" cy="16" r="4" fill="none" stroke="#fbbf24" stroke-width="2"/>
    </symbol>
    <symbol id="icRisk" viewBox="0 0 24 24">
      <path d="M12 3 L22 21 H2 Z" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linejoin="round"/>
      <line x1="12" y1="10" x2="12" y2="15" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="18" r="1.4" fill="#fbbf24"/>
    </symbol>
    <symbol id="icBest" viewBox="0 0 24 24">
      <path d="M12 2.5 L14.7 8.6 L21.3 9.2 L16.3 13.6 L17.9 20 L12 16.5 L6.1 20 L7.7 13.6 L2.7 9.2 L9.3 8.6 Z" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icBottleneck" viewBox="0 0 24 24">
      <path d="M3 18 A9 9 0 0 1 21 18" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="18" x2="17.5" y2="11.5" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <circle cx="12" cy="18" r="2.2" fill="#fbbf24"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1200" height="790" rx="24" fill="url(#bg)"/>

  <!-- title -->
  <text x="600" y="54" text-anchor="middle" font-size="32" font-weight="700" fill="#f1f5f9">From scattered agent memory to organizational intelligence</text>
  <text x="600" y="88" text-anchor="middle" font-size="16" fill="#94a3b8">Designed for any memory-producing agent — today's MVP starts with CLI coding agents. The loop runs itself.</text>

  <!-- ===== LEFT: the loop ===== -->
  <!-- hierarchy caption -->
  <text x="375" y="124" text-anchor="middle" font-size="12.5" fill="#8b95ad">scales into a tree — team → department → org</text>

  <!-- distillation root -->
  <rect x="195" y="138" width="360" height="112" rx="18" fill="url(#rootFill)" stroke="#a78bfa" stroke-width="2"/>
  <text x="375" y="180" text-anchor="middle" font-size="22" font-weight="700" fill="#ede9fe">Distillation Root</text>
  <text x="375" y="205" text-anchor="middle" font-size="12.5" fill="#c4b5fd">clusters every leaf's reports → distills with an LLM</text>
  <rect x="300" y="218" width="150" height="24" rx="12" fill="#2e2150" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="375" y="234" text-anchor="middle" font-size="11.5" fill="#ddd6fe">pluggable LLM</text>

  <!-- distill chip -->
  <rect x="305" y="262" width="140" height="30" rx="15" fill="#241a40" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="375" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#ddd6fe">② Distill</text>

  <!-- report lane (up) -->
  <line x1="320" y1="518" x2="320" y2="300" stroke="#38bdf8" stroke-width="11" stroke-linecap="round" marker-end="url(#ahCyan)"/>
  <!-- feedback lane (down) -->
  <line x1="430" y1="300" x2="430" y2="518" stroke="#34d399" stroke-width="11" stroke-linecap="round" marker-end="url(#ahEmerald)"/>

  <!-- step chips -->
  <rect x="168" y="370" width="138" height="48" rx="12" fill="#0e2233" stroke="#38bdf8" stroke-width="1.4"/>
  <text x="237" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="#7dd3fc">① Report</text>
  <text x="237" y="409" text-anchor="middle" font-size="10.5" fill="#9fc7e0">auto · redacted · cited</text>

  <rect x="444" y="370" width="150" height="48" rx="12" fill="#0d2b22" stroke="#34d399" stroke-width="1.4"/>
  <text x="519" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="#6ee7b7">③ Feed back</text>
  <text x="519" y="409" text-anchor="middle" font-size="10.5" fill="#9fe0c4">ranked by relevance</text>

  <!-- shared git repo / release gate sits on the pipeline -->
  <rect x="216" y="461" width="318" height="34" rx="17" fill="#0f1830" stroke="#7c89a3" stroke-width="1.4"/>
  <circle cx="245" cy="478" r="6.5" fill="none" stroke="#9fb0cc" stroke-width="2"/>
  <circle cx="245" cy="478" r="2" fill="#9fb0cc"/>
  <text x="392" y="483" text-anchor="middle" font-size="12.5" fill="#dbe3f0">Shared Git repo · review &amp; release gate</text>

  <!-- leaf agents -->
  <g>
    <!-- pod 1 -->
    <rect x="75" y="540" width="180" height="128" rx="14" fill="#16223b" stroke="#2b3b57" stroke-width="1.5"/>
    <text x="165" y="566" text-anchor="middle" font-size="13.5" font-weight="700" fill="#cbd5e1">Coding agent</text>
    <use href="#person" x="120" y="578" width="26" height="31"/>
    <use href="#robot" x="158" y="576" width="34" height="34"/>
    <rect x="99" y="630" width="60" height="22" rx="11" fill="#1f2a40" stroke="#475569" stroke-width="1"/>
    <text x="129" y="645" text-anchor="middle" font-size="10.5" fill="#94a3b8">private</text>
    <rect x="171" y="630" width="54" height="22" rx="11" fill="#10241d" stroke="#34d399" stroke-width="1"/>
    <text x="198" y="645" text-anchor="middle" font-size="10.5" fill="#6ee7b7">team</text>

    <!-- pod 2 -->
    <rect x="285" y="540" width="180" height="128" rx="14" fill="#16223b" stroke="#2b3b57" stroke-width="1.5"/>
    <text x="375" y="566" text-anchor="middle" font-size="13.5" font-weight="700" fill="#cbd5e1">Research agent</text>
    <use href="#person" x="330" y="578" width="26" height="31"/>
    <use href="#robot" x="368" y="576" width="34" height="34"/>
    <rect x="309" y="630" width="60" height="22" rx="11" fill="#1f2a40" stroke="#475569" stroke-width="1"/>
    <text x="339" y="645" text-anchor="middle" font-size="10.5" fill="#94a3b8">private</text>
    <rect x="381" y="630" width="54" height="22" rx="11" fill="#10241d" stroke="#34d399" stroke-width="1"/>
    <text x="408" y="645" text-anchor="middle" font-size="10.5" fill="#6ee7b7">team</text>

    <!-- pod 3 -->
    <rect x="495" y="540" width="180" height="128" rx="14" fill="#16223b" stroke="#2b3b57" stroke-width="1.5"/>
    <text x="585" y="566" text-anchor="middle" font-size="13.5" font-weight="700" fill="#cbd5e1">Support / Ops agent</text>
    <use href="#person" x="540" y="578" width="26" height="31"/>
    <use href="#robot" x="578" y="576" width="34" height="34"/>
    <rect x="519" y="630" width="60" height="22" rx="11" fill="#1f2a40" stroke="#475569" stroke-width="1"/>
    <text x="549" y="645" text-anchor="middle" font-size="10.5" fill="#94a3b8">private</text>
    <rect x="591" y="630" width="54" height="22" rx="11" fill="#10241d" stroke="#34d399" stroke-width="1"/>
    <text x="618" y="645" text-anchor="middle" font-size="10.5" fill="#6ee7b7">team</text>
  </g>

  <!-- ===== RIGHT: organizational intelligence ===== -->
  <!-- branch arrow root -> panel -->
  <path d="M556 188 H752" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-dasharray="2 0" marker-end="url(#ahAmber)"/>
  <text x="655" y="178" text-anchor="middle" font-size="11" fill="#fbbf24">also yields</text>

  <rect x="760" y="138" width="400" height="474" rx="20" fill="url(#panelFill)" stroke="#fbbf24" stroke-width="2"/>
  <text x="960" y="176" text-anchor="middle" font-size="20" font-weight="700" fill="#fde68a">Organizational Intelligence</text>
  <text x="960" y="200" text-anchor="middle" font-size="12" fill="#d6c08a">patterns no single agent or person can see</text>

  <!-- row 1 -->
  <rect x="782" y="214" width="356" height="88" rx="12" fill="#1b2030" stroke="#3b3a2a" stroke-width="1.2"/>
  <circle cx="818" cy="258" r="19" fill="#2a2412"/>
  <use href="#icCommon" x="804" y="244" width="28" height="28"/>
  <text x="850" y="250" font-size="15" font-weight="700" fill="#fde68a">Common problems, surfaced</text>
  <text x="850" y="274" font-size="11.5" fill="#cbd5e1">one failure, many teams — named &amp; fixed once</text>

  <!-- row 2 -->
  <rect x="782" y="310" width="356" height="88" rx="12" fill="#1b2030" stroke="#3b3a2a" stroke-width="1.2"/>
  <circle cx="818" cy="354" r="19" fill="#2a2412"/>
  <use href="#icRisk" x="804" y="340" width="28" height="28"/>
  <text x="850" y="346" font-size="15" font-weight="700" fill="#fde68a">Latent risks, flagged early</text>
  <text x="850" y="370" font-size="11.5" fill="#cbd5e1">a recurring bad signal becomes an early warning</text>

  <!-- row 3 -->
  <rect x="782" y="406" width="356" height="88" rx="12" fill="#1b2030" stroke="#3b3a2a" stroke-width="1.2"/>
  <circle cx="818" cy="450" r="19" fill="#2a2412"/>
  <use href="#icBest" x="804" y="436" width="28" height="28"/>
  <text x="850" y="442" font-size="15" font-weight="700" fill="#fde68a">Best practices, diffused</text>
  <text x="850" y="466" font-size="11.5" fill="#cbd5e1">the best approach reaches everyone, fast</text>

  <!-- row 4 -->
  <rect x="782" y="502" width="356" height="88" rx="12" fill="#1b2030" stroke="#3b3a2a" stroke-width="1.2"/>
  <circle cx="818" cy="546" r="19" fill="#2a2412"/>
  <use href="#icBottleneck" x="804" y="532" width="28" height="28"/>
  <text x="850" y="538" font-size="15" font-weight="700" fill="#fde68a">Efficiency bottlenecks, exposed</text>
  <text x="850" y="562" font-size="11.5" fill="#cbd5e1">where work stalls or duplicates — made visible</text>

  <!-- ===== bottom: properties ===== -->
  <rect x="40" y="706" width="360" height="54" rx="12" fill="#13182a" stroke="#2b3b57" stroke-width="1.2"/>
  <text x="60" y="730" font-size="14" font-weight="700" fill="#e2e8f0">Agent-native</text>
  <text x="60" y="749" font-size="11.5" fill="#94a3b8">harvested from memory agents already produce</text>

  <rect x="420" y="706" width="360" height="54" rx="12" fill="#13182a" stroke="#2b3b57" stroke-width="1.2"/>
  <text x="440" y="730" font-size="14" font-weight="700" fill="#e2e8f0">Git-backed</text>
  <text x="440" y="749" font-size="11.5" fill="#94a3b8">provenance · history · review · rollback</text>

  <rect x="800" y="706" width="360" height="54" rx="12" fill="#13182a" stroke="#2b3b57" stroke-width="1.2"/>
  <text x="820" y="730" font-size="14" font-weight="700" fill="#e2e8f0">Pluggable by config</text>
  <text x="820" y="749" font-size="11.5" fill="#94a3b8">policy, distillation &amp; delivery are config</text>
</svg>
