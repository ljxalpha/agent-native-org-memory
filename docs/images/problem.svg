<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="siloFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16223b"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>

    <symbol id="person" viewBox="0 0 40 48">
      <circle cx="20" cy="13" r="9" fill="#cbd5e1"/>
      <path d="M5 46 C5 31 35 31 35 46 Z" fill="#cbd5e1"/>
    </symbol>

    <symbol id="robot" viewBox="0 0 48 48">
      <line x1="24" y1="9" x2="24" y2="3" stroke="#64748b" stroke-width="2"/>
      <circle cx="24" cy="3" r="2.6" fill="#38bdf8"/>
      <rect x="8" y="9" width="32" height="28" rx="7" fill="#1f2d45" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="18" cy="23" r="3.2" fill="#38bdf8"/>
      <circle cx="30" cy="23" r="3.2" fill="#38bdf8"/>
      <rect x="17" y="30" width="14" height="3" rx="1.5" fill="#38bdf8" opacity="0.55"/>
    </symbol>

    <symbol id="db" viewBox="0 0 44 50">
      <path d="M4 9 V41 A18 6.5 0 0 0 40 41 V9" fill="#243349" stroke="#3b5172" stroke-width="2"/>
      <ellipse cx="22" cy="20" rx="18" ry="6.5" fill="none" stroke="#3b5172" stroke-width="1.1" opacity="0.55"/>
      <ellipse cx="22" cy="31" rx="18" ry="6.5" fill="none" stroke="#3b5172" stroke-width="1.1" opacity="0.55"/>
      <ellipse cx="22" cy="9" rx="18" ry="6.5" fill="#31486a" stroke="#3b5172" stroke-width="2"/>
    </symbol>

    <symbol id="x" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="11" fill="#f43f5e"/>
      <path d="M8 8 L16 16 M16 8 L8 16" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
    </symbol>

    <symbol id="lock" viewBox="0 0 24 24">
      <rect x="4" y="10" width="16" height="12" rx="2.5" fill="#475569"/>
      <path d="M7 10 V7 a5 5 0 0 1 10 0 V10" fill="none" stroke="#475569" stroke-width="2.4"/>
      <circle cx="12" cy="15" r="2" fill="#0b1220"/>
    </symbol>
  </defs>

  <rect x="0" y="0" width="1200" height="624" rx="24" fill="url(#bg)"/>

  <!-- title -->
  <text x="600" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#f1f5f9">Today, agent memory is trapped in silos</text>
  <text x="600" y="92" text-anchor="middle" font-size="17" fill="#94a3b8">Every person-and-agent pair learns hard-won lessons. Almost none of it crosses the wall.</text>

  <!-- leadership pill -->
  <rect x="370" y="118" width="460" height="46" rx="23" fill="#1a2740" stroke="#fbbf24" stroke-width="1.5"/>
  <ellipse cx="404" cy="141" rx="12" ry="7" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="404" cy="141" r="3.4" fill="#fbbf24"/>
  <text x="620" y="147" text-anchor="middle" font-size="16" font-weight="600" fill="#fde68a">Leadership sees fragments, not the whole</text>

  <!-- blocked sightlines -->
  <g stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.5">
    <line x1="600" y1="166" x2="222" y2="200"/>
    <line x1="600" y1="166" x2="978" y2="200"/>
  </g>
  <line x1="600" y1="166" x2="600" y2="200" stroke="#fbbf24" stroke-width="1.7" opacity="0.95"/>
  <use href="#x" x="211" y="195" width="18" height="18"/>
  <use href="#x" x="967" y="195" width="18" height="18"/>

  <!-- silos -->
  <g>
    <!-- Team A -->
    <rect x="80" y="214" width="280" height="250" rx="18" fill="url(#siloFill)" stroke="#2b3b57" stroke-width="1.5"/>
    <rect x="80" y="214" width="6" height="250" rx="3" fill="#2b3b57"/>
    <rect x="354" y="214" width="6" height="250" rx="3" fill="#2b3b57"/>
    <text x="220" y="248" text-anchor="middle" font-size="19" font-weight="700" fill="#e2e8f0">Unit A</text>
    <use href="#person" x="151" y="258" width="34" height="41"/>
    <use href="#robot" x="200" y="256" width="44" height="44"/>
    <text x="220" y="320" text-anchor="middle" font-size="12" fill="#7c8aa3">1 person · 1 agent</text>
    <use href="#db" x="196" y="330" width="44" height="50"/>
    <use href="#lock" x="246" y="338" width="18" height="18"/>
    <text x="220" y="402" text-anchor="middle" font-size="13" fill="#94a3b8">private memory — siloed</text>

    <!-- Team B -->
    <rect x="460" y="214" width="280" height="250" rx="18" fill="url(#siloFill)" stroke="#2b3b57" stroke-width="1.5"/>
    <rect x="460" y="214" width="6" height="250" rx="3" fill="#2b3b57"/>
    <rect x="734" y="214" width="6" height="250" rx="3" fill="#2b3b57"/>
    <text x="600" y="248" text-anchor="middle" font-size="19" font-weight="700" fill="#e2e8f0">Unit B</text>
    <use href="#person" x="531" y="258" width="34" height="41"/>
    <use href="#robot" x="580" y="256" width="44" height="44"/>
    <text x="600" y="320" text-anchor="middle" font-size="12" fill="#7c8aa3">1 person · 1 agent</text>
    <use href="#db" x="576" y="330" width="44" height="50"/>
    <use href="#lock" x="626" y="338" width="18" height="18"/>
    <text x="600" y="402" text-anchor="middle" font-size="13" fill="#94a3b8">private memory — siloed</text>

    <!-- Team C -->
    <rect x="840" y="214" width="280" height="250" rx="18" fill="url(#siloFill)" stroke="#2b3b57" stroke-width="1.5"/>
    <rect x="840" y="214" width="6" height="250" rx="3" fill="#2b3b57"/>
    <rect x="1114" y="214" width="6" height="250" rx="3" fill="#2b3b57"/>
    <text x="980" y="248" text-anchor="middle" font-size="19" font-weight="700" fill="#e2e8f0">Unit C</text>
    <use href="#person" x="911" y="258" width="34" height="41"/>
    <use href="#robot" x="960" y="256" width="44" height="44"/>
    <text x="980" y="320" text-anchor="middle" font-size="12" fill="#7c8aa3">1 person · 1 agent</text>
    <use href="#db" x="956" y="330" width="44" height="50"/>
    <use href="#lock" x="1006" y="338" width="18" height="18"/>
    <text x="980" y="402" text-anchor="middle" font-size="13" fill="#94a3b8">private memory — siloed</text>
  </g>

  <!-- broken cross-team flows -->
  <g stroke="#fb7185" stroke-width="2.2" stroke-dasharray="7 5">
    <line x1="368" y1="337" x2="452" y2="337"/>
    <line x1="748" y1="337" x2="832" y2="337"/>
  </g>
  <use href="#x" x="397" y="324" width="26" height="26"/>
  <use href="#x" x="777" y="324" width="26" height="26"/>
  <text x="410" y="372" text-anchor="middle" font-size="12" fill="#fb7185">won't cross</text>
  <text x="790" y="372" text-anchor="middle" font-size="12" fill="#fb7185">won't cross</text>

  <!-- latency mismatch -->
  <rect x="206" y="502" width="324" height="52" rx="26" fill="#10241d" stroke="#34d399" stroke-width="1.6"/>
  <circle cx="246" cy="528" r="6" fill="#34d399"/>
  <text x="376" y="533" text-anchor="middle" font-size="16" font-weight="600" fill="#6ee7b7">Agent does the work in minutes</text>

  <text x="600" y="534" text-anchor="middle" font-size="16" font-weight="700" fill="#94a3b8">vs</text>

  <rect x="672" y="502" width="358" height="52" rx="26" fill="#2a1620" stroke="#fb7185" stroke-width="1.6"/>
  <circle cx="712" cy="528" r="6" fill="#fb7185"/>
  <text x="855" y="533" text-anchor="middle" font-size="16" font-weight="600" fill="#fda4af">Human relay takes hours to days</text>

  <text x="600" y="592" text-anchor="middle" font-size="15" fill="#cbd5e1">The agent is no longer the bottleneck — moving knowledge between people is.</text>
</svg>
