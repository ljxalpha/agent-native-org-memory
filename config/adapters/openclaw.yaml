# EXPERIMENTAL: calibrated against the on-disk layout of openclaw 2026.3.2,
# captured read-only from a real install (redacted snapshot in
# tests/fixtures/adapters/openclaw/). What the layout evidence covers:
#   · `workspace/` is the agent working root, so AGENT_ROOT == <openclaw home>/workspace.
#   · `AGENTS.md` at that root is the per-session instruction file — its own body
#     prescribes the read order (SOUL.md -> USER.md -> memory/YYYY-MM-DD.md -> MEMORY.md),
#     which is why it is the hint target.
#   · The native memory store is a sqlite sidecar, `<openclaw home>/memory/main.sqlite`,
#     living one level ABOVE the managed root `${AGENT_ROOT}/memory/shared`; native daily
#     notes `${AGENT_ROOT}/memory/YYYY-MM-DD.md` are siblings of that managed root.
#     Neither is reachable by a glob relative to the managed root.
#   · Secret-bearing siblings (`.env`, `credentials/`, `logs/`, `agents/`) sit at those
#     same levels, i.e. also out of glob range. `exclude` below repeats them as defense
#     in depth against a misplaced copy *inside* the managed root — see the note there
#     for which of those rules can actually fire and which are declarative only.
# What the evidence does NOT cover: whether openclaw actually consumes an injected hint
# block (no real agent run was made). Hence support_status stays `experimental` and
# loading requires MEMORY_NET_ALLOW_EXPERIMENTAL_ADAPTER=1.
# Threat model for the managed root: any read outside ${AGENT_ROOT}/memory/shared would
# expose agent-private state (MEMORY.md / USER.md) or credentials; escapes via `..`
# patterns and via symlinks are rejected by the adapter, not merely filtered here.
name: openclaw
support_status: experimental
roots:
  shared:
    - alias: openclaw-shared
      base_dir: "${AGENT_ROOT}/memory/shared"
      include: ["**/*.md"]
      # `**/` means "zero or more segments" on both the include and the exclude side,
      # so one spelling covers the managed root itself as well as any depth below it.
      #
      # Only the three directory rules can actually fire: a file reaches `exclude`
      # only after passing `include` and `file_pattern: "*.md"`, and hidden paths are
      # skipped earlier still. `**/*.sqlite*` and `.env` are therefore DECLARATIVE —
      # they never execute today and are kept so that widening `file_pattern` later
      # cannot silently start collecting the native store or the secrets file.
      exclude:
        - "**/.git/**"
        - "**/.cache/**"
        - "**/*.sqlite*"
        - ".env"
        - "**/credentials/**"
        - "**/agents/**"
        - "**/logs/**"
team_target: "${AGENT_ROOT}/memory/team"
file_pattern: "*.md"
frontmatter_required: false
team_hint_injection:
  mode: install_once
  target: "${AGENT_ROOT}/AGENTS.md"
  install_once_default: "${AGENT_ROOT}/AGENTS.md"
  anchor_start: "<!-- memory-net-hint:start -->"
  anchor_end: "<!-- memory-net-hint:end -->"
  content_template: |
    @memory/team/INDEX.md
