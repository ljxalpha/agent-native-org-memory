name: hermes
# The layout below is calibrated against a hermes v0.18.0 install (redacted
# snapshot: tests/fixtures/adapters/hermes/). A calibrated *read* path is not
# evidence of a consumed hint, and only the second one lifts this flag.
#
# A real agent run on 2026-08-11 did NOT establish it, and the way it failed is
# worth recording. The run passed `--ignore-rules`, which maps to
# `skip_context_files=True`, so AGENTS.md never entered the system prompt: the
# agent returned the sentinel from the injected INDEX.md without any hint being
# present at all. That is a useful negative result -- an agent with file tools,
# asked for "the team memory index your instructions reference", finds and
# reads `memory/team/INDEX.md` unaided -- but it is evidence about filesystem
# discovery, not about this hint. The control also removed the hint and the
# index together, so it could not have separated the two either.
#
# The check has since been corrected (no `--ignore-rules`; the control drops
# the hint alone and keeps the index). A run under that design is what this
# flag is waiting for.
#
# One calibration fact worth keeping, established by source: the hint's bare
# `@memory/team/INDEX.md` is not a hermes reference. The agent does expand
# `@`-references (`agent/context_references.py`), but only the `@file:`,
# `@folder:`, `@git:`, `@url:`, `@diff` and `@staged` forms -- a bare path does
# not match. So when AGENTS.md *is* loaded, the hint reaches the model as plain
# text that it may choose to act on, not as a framework-expanded include.
# That is version-specific and an upgrade invalidates it.
support_status: experimental
roots:
  shared:
    # The memory-net convention directory, never the agent's own store. The
    # native store is ~/.hermes/memories/, and it stays out of scope by
    # construction: it is not under the managed root at all.
    - alias: hermes-shared
      base_dir: "${AGENT_ROOT}/memory/shared"
      include: ["**/*.md"]
      # `**/*.lock` is here because of where the lock files are: a real install
      # keeps MEMORY.md.lock as a *sibling* of MEMORY.md, so a lock can appear
      # inside the managed root the moment an agent writes there.
      exclude: [".git/**", "**/.git/**", ".cache/**", "**/.cache/**", "**/*.lock"]
team_target: "${AGENT_ROOT}/memory/team"
file_pattern: "*.md"
frontmatter_required: false
team_hint_injection:
  mode: install_once
  target: "${AGENT_ROOT}/AGENTS.md"
  install_once_default: "${AGENT_ROOT}/AGENTS.md"
  # Stated rather than defaulted, matching claude-code.yaml. The replacement is
  # idempotent either way; writing them down means the marker a reader greps for
  # is in the file that defines it.
  anchor_start: "<!-- memory-net-hint:start -->"
  anchor_end: "<!-- memory-net-hint:end -->"
  content_template: |
    @memory/team/INDEX.md
