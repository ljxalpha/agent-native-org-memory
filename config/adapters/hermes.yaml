name: hermes
# Calibrated against a hermes v0.18.0 install (redacted snapshot:
# tests/fixtures/adapters/hermes/), and exercised by a real paired agent run on
# 2026-08-11 that produced a positive result:
#
#   positive: AGENTS.md carries the injected reference; memory/team/INDEX.md
#             holds a fresh 16-character sentinel.  -> sentinel returned
#   control:  the same tree, the same INDEX.md, the same sentinel, the sandbox
#             home restored from a pre-run snapshot; the reference alone
#             removed.                              -> sentinel not returned
#
# The control is what makes that a measurement rather than a demonstration. An
# earlier attempt removed the index alongside the hint, and a prior run had
# shown that an agent with file tools finds and reads that file unaided as soon
# as the prompt hints such a thing exists -- so the prompt now describes nothing
# ("Reply with the verification token and nothing else") and the file sits in
# both arms. Measured free via `prompt-size`: the instruction file does reach
# the system prompt (250 vs 168 bytes of context), and the whole difference is
# the 82-byte hint block while INDEX.md is 169 bytes, so the index was not
# added to that section wholesale.
#
# STILL experimental, and the reason is the status itself rather than the
# result. `stable` is a claim about a supported integration -- about what
# happens when someone else runs this -- and the evidence is a single
# unreplicated pair, always in the same order, against one model that samples.
# One observation is not a rate. Two narrower gaps in the same direction: that
# run predates the check's refusal of a silent control, so there is no retained
# proof its control answered rather than failing quietly; and "the sentinel
# arrived through a tool read" does not follow from the byte delta alone, which
# shows only that the index did not land in the measured context section.
#
# To promote: replicated pairs with fresh sentinels and counterbalanced order,
# a retained sanitized report showing a non-empty control answer, and the model
# and provider recorded. `scripts/verify_adapter_consumption` does all of this
# except the repetition, which is a matter of budget rather than design.
#
# One calibration note kept from the investigation: the bare
# `@memory/team/INDEX.md` is not a hermes reference form. The agent does expand
# `@`-references (`agent/context_references.py`), but only `@file:`, `@folder:`,
# `@git:`, `@url:`, `@diff` and `@staged`. The hint reaches the model as plain
# text that it may act on.
support_status: experimental
roots:
  shared:
    # The memory-net convention directory, never the agent's own store. The
    # native store is ~/.hermes/memories/, and it stays out of scope by
    # construction: it is not under the managed root at all.
    - alias: hermes-shared
      base_dir: "${AGENT_ROOT}/memory/shared"
      include: ["**/*.md"]
      # `**/*.lock` is here because of where the lock files are: a real install
      # keeps MEMORY.md.lock as a *sibling* of MEMORY.md, so a lock can appear
      # inside the managed root the moment an agent writes there.
      exclude: [".git/**", "**/.git/**", ".cache/**", "**/.cache/**", "**/*.lock"]
team_target: "${AGENT_ROOT}/memory/team"
file_pattern: "*.md"
frontmatter_required: false
team_hint_injection:
  mode: install_once
  target: "${AGENT_ROOT}/AGENTS.md"
  install_once_default: "${AGENT_ROOT}/AGENTS.md"
  # Stated rather than defaulted, matching claude-code.yaml. The replacement is
  # idempotent either way; writing them down means the marker a reader greps for
  # is in the file that defines it.
  anchor_start: "<!-- memory-net-hint:start -->"
  anchor_end: "<!-- memory-net-hint:end -->"
  content_template: |
    @memory/team/INDEX.md
