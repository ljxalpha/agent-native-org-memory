name: hermes
# Verified against hermes v0.18.0 by a real paired agent run, 2026-08-11.
#
# The layout below is calibrated against that install (redacted snapshot:
# tests/fixtures/adapters/hermes/). A calibrated *read* path is not evidence of
# a consumed hint, so the flag rests on the run, which was paired and varied
# one thing:
#
#   positive: AGENTS.md carries the injected reference; memory/team/INDEX.md
#             holds a fresh 16-character sentinel.  -> sentinel returned
#   control:  the same tree, the same INDEX.md, the same sentinel, the same
#             restored agent state; the reference alone removed.
#                                                    -> sentinel NOT returned
#
# The control is what makes this evidence rather than a demonstration. An
# earlier attempt removed the index alongside the hint, and a prior run had
# already shown that an agent with file tools finds and reads that file unaided
# when the prompt so much as mentions it. So the prompt now describes nothing
# ("Reply with the verification token and nothing else") and the file is
# present in both arms. It came back only when the reference did.
#
# Two facts measured rather than argued, both at zero cost via `prompt-size`:
# the instruction file does reach the system prompt (250 vs 168 bytes of
# context between the two trees), and the index is *not* inlined -- the whole
# difference is the 82-byte hint block, while INDEX.md is 169 bytes. So the
# sentinel arrived through a tool read.
#
# Limits, stated so nobody has to guess: a successful one-shot writes no
# session trace on this platform, so the tool set offered and the call sequence
# are unverified mechanically; this is one paired observation on one model, not
# a rate; and it is a fact about this version -- re-run
# `scripts/verify_adapter_consumption` after a major agent upgrade.
#
# One calibration note kept from the investigation: the bare
# `@memory/team/INDEX.md` is not a hermes reference form. The agent does expand
# `@`-references (`agent/context_references.py`), but only `@file:`, `@folder:`,
# `@git:`, `@url:`, `@diff` and `@staged`. The hint reaches the model as plain
# text it chooses to act on, which is precisely what the run showed it doing.
support_status: stable
roots:
  shared:
    # The memory-net convention directory, never the agent's own store. The
    # native store is ~/.hermes/memories/, and it stays out of scope by
    # construction: it is not under the managed root at all.
    - alias: hermes-shared
      base_dir: "${AGENT_ROOT}/memory/shared"
      include: ["**/*.md"]
      # `**/*.lock` is here because of where the lock files are: a real install
      # keeps MEMORY.md.lock as a *sibling* of MEMORY.md, so a lock can appear
      # inside the managed root the moment an agent writes there.
      exclude: [".git/**", "**/.git/**", ".cache/**", "**/.cache/**", "**/*.lock"]
team_target: "${AGENT_ROOT}/memory/team"
file_pattern: "*.md"
frontmatter_required: false
team_hint_injection:
  mode: install_once
  target: "${AGENT_ROOT}/AGENTS.md"
  install_once_default: "${AGENT_ROOT}/AGENTS.md"
  # Stated rather than defaulted, matching claude-code.yaml. The replacement is
  # idempotent either way; writing them down means the marker a reader greps for
  # is in the file that defines it.
  anchor_start: "<!-- memory-net-hint:start -->"
  anchor_end: "<!-- memory-net-hint:end -->"
  content_template: |
    @memory/team/INDEX.md
